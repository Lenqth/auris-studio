[package]
name = "auris-gpui"
description = "The gpui desktop frontend for Auris Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
asio = ["auris-session/asio"]

[[bin]]
name = "auris-studio"
path = "src/main.rs"

# The frontend uses the session, presentation libraries and UI-free agent transport.
# If this list ever needs `auris-engine` or `auris-dsp` directly, something that belongs in the
# session layer has leaked into the UI.
[dependencies]
auris-agent.workspace = true
auris-i18n.workspace = true
auris-session.workspace = true
env_logger.workspace = true
log.workspace = true

# gpui-pre is the Zed snapshot gpui-component's author publishes; the crate is still `gpui`. The
# released gpui 0.2.2 left Windows IME composition broken, and crates.io has nothing later.
gpui = { package = "gpui-pre", version = "=0.3.10" }
# The platforms live in their own crate since that snapshot.
# `runtime_shaders` makes gpui compile its Metal shaders through the Metal framework at startup.
# The build-time path shells out to `xcrun metal`, which lives inside Xcode and is unreachable
# while `xcode-select -p` points at the Command Line Tools.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders"] }
# Atelier's adopted Glass language, for now from the fork that carries it onto gpui-pre
# (uthree/design-language#31). Return to the upstream repository once that is merged.
atelier = { git = "https://github.com/Lenqth/ut-design-language", rev = "adb9164c4c8a2671d1713adb7e473b5390fdd647" }
gpui-flow = { path = "../../vendor/gpui-flow" }
# The agent transcript uses selectable Markdown without language-specific highlighting.
# It shares gpui's version and stays wholly inside this presentation crate.
# Each component release pins one gpui-pre snapshot; 0.8.1 is the one built on 0.3.10.
gpui-component = "=0.8.1"
# Its own base crate, for the one root element the component crate does not re-export: the
# layer that makes Markdown selectable in a window.
gpui-base = "=0.8.1"
# Share the renderer's GFM parser; the transcript owns block and list layout.
markdown = "1"
# Decode voice artwork on a worker, with bounded dimensions before GPUI sees the pixels.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.17"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
semver.workspace = true
ureq.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
# Decodes the file URLs macOS hands over when a project is double-clicked in Finder.
url.workspace = true
jsonc-parser = { version = "0.26", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0"

# The same gpui, with its test platform switched on: a window with no display, no GPU and no font
# system behind it, driven from `cargo test`. Only the test build gets it — a dev-dependency is
# not linked into the binary — and `test-support` is also what turns `debug_selector` from a
# no-op into the hook `VisualTestContext::debug_bounds` reads.
[dev-dependencies]
hound.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders", "test-support"] }
tempfile.workspace = true
